; Eye camera firmware for the ESP32-S3 CAM boards (N16R8: 16 MB flash, 8 MB octal PSRAM;
; GOOUUU / Freenove-style "ESP32-S3-WROOM CAM" with two USB-C ports).
; Same pioarduino platform tag as brow_tracker: its arduino-esp32 libs are already cached.
; Build/upload from PowerShell (the ESP-IDF 5.x tools refuse to run under Git Bash).
; Serial is the native USB port (USB CDC): ~1 MB/s, enough for a full-resolution preview;
; use the port labelled "USB" (not "COM"/"UART") for both flashing and the PC tools.
[platformio]
default_envs = esp32s3cam

[env:esp32s3cam]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
monitor_speed = 921600
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -O2
build_unflags =
    -Os

; Camera-less bench (src/bench_main.cpp) for any ESP32-S3 N16R8 on its UART bridge port:
; frames come from the PC (tools/hw_bench.py). Used on the hub test board (COM7) before
; the camera boards arrived; its original flash is in ../../_backups/.
[env:s3bench]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
monitor_speed = 2000000
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DEYE_BENCH
    -DEYE_PROFILE
    -O2
build_unflags =
    -Os

; The brow tracker's AI-Thinker ESP32-CAM (classic ESP32, 4 MB PSRAM, CH340 on its MB
; board): eye firmware on a real camera before the S3 camera boards arrive. Serial is the
; UART at 921600. Its brow firmware: ../../_backups/esp32cam_brow_COM3_2026-10-10.bin or
; ../brows/flash_firmware.bat.
[env:esp32cam]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32cam
framework = arduino
monitor_speed = 921600
; The CH340 programmer of this board fails mid-flash at higher speeds (brow_tracker notes).
upload_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCAM_AITHINKER
    -DEYE_PROFILE
    -O2
build_unflags =
    -Os
