; Mouth camera streamer for the AI-Thinker ESP32-CAM (bring-up and recordings until the
; ESP32-S3 CAM boards arrive). Same pioarduino platform tag as brow_tracker / eye_tracker.
; Build/upload from PowerShell (the ESP-IDF 5.x tools refuse to run under Git Bash).
[env:esp32cam]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32cam
framework = arduino
monitor_speed = 921600
; The CH340 programmer of this board fails mid-flash at higher speeds.
upload_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -O2
build_unflags =
    -Os
