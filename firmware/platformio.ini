; Brow camera firmware for the AI-Thinker style ESP32-CAM (same board as esp32_systems/esp32_cam).
; Same pioarduino platform tag as the other modules: its arduino-esp32 3.3.11 libs are
; already in the PlatformIO cache (~2 GB); a new tag would download them again.
; Build/upload from PowerShell (the ESP-IDF 5.x tools refuse to run under Git Bash).
[env:esp32cam]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32cam
framework = arduino
monitor_speed = 921600
; The CH340 programmer of this board fails mid-flash at higher speeds.
upload_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -O2
build_unflags =
    -Os
