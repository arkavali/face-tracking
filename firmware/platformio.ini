; Eye camera firmware for the ESP32-S3 CAM boards (N16R8: 16 MB flash, 8 MB octal PSRAM;
; GOOUUU / Freenove-style "ESP32-S3-WROOM CAM" with two USB-C ports).
; Same pioarduino platform tag as brow_tracker: its arduino-esp32 libs are already cached.
; Build/upload from PowerShell (the ESP-IDF 5.x tools refuse to run under Git Bash).
; Serial is the native USB port (USB CDC): ~1 MB/s, enough for a full-resolution preview;
; use the port labelled "USB" (not "COM"/"UART") for both flashing and the PC tools.
[env:esp32s3cam]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
monitor_speed = 921600
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -O2
build_unflags =
    -Os
